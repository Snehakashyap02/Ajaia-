services:
  - type: web
    name: ajaia-docs
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/ajaia_docs.db
    disk:
      name: ajaia-docs-data
      mountPath: /var/data
      sizeGB: 1
